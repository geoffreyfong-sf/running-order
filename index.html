<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Running Order</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Running Order">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E9EEF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121A21" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Concept: a broadcast rundown. Slot numbers run down the left edge, and the
   item on air sits at slot 0 with a tally light. */
:root {
  --bg:#E9EEF2; --panel:#F7F9FA; --ink:#14202B; --muted:#566673; --line:#CFD8DF;
  --accent:#2448C8; --on-accent:#fff; --tally:#C8102E;
  --display:"Bricolage Grotesque","Avenir Next",-apple-system,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark) { :root {
  --bg:#121A21; --panel:#1B252E; --ink:#EAF0F4; --muted:#9BABB8; --line:#2E3B46;
  --accent:#9DB3FF; --on-accent:#10182E; --tally:#FF5A6E; color-scheme:dark;
} }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.35 var(--body); overflow:hidden; }
[hidden] { display:none !important; }
button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

#app { height:100%; display:flex; flex-direction:column; max-width:640px; margin:0 auto; }
header { padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px)); display:flex; align-items:center; justify-content:space-between; gap:12px; }
h1 { margin:0; font:700 28px/1.1 var(--display); letter-spacing:-.02em; }
.head-right { display:flex; align-items:center; gap:6px; min-width:0; }
#refreshBtn { width:44px; height:44px; display:grid; place-items:center; color:var(--accent); flex:none; }
#refreshBtn svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
#refreshBtn.busy svg { animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { #refreshBtn.busy svg { animation:none; } }
#status { white-space:pre-line; line-height:1.25; font-size:12px; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; }

nav { display:flex; gap:20px; padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px)); border-bottom:1px solid var(--line); }
nav button { padding:10px 0; font-weight:600; font-size:15px; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; }
nav button[aria-selected="true"] { color:var(--ink); border-color:var(--accent); }

main { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px)); }
ol { list-style:none; margin:0; padding:0; }

.row { display:grid; grid-template-columns:30px 44px minmax(0,1fr) 40px 36px; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); background:var(--bg); }
.row.dragging { background:var(--panel); box-shadow:0 6px 18px rgb(0 0 0 / .18); position:relative; z-index:2; }
.slot { font:500 15px var(--display); color:var(--muted); text-align:center; font-variant-numeric:tabular-nums; }
.row.on .slot { color:var(--tally); }
.tally { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--tally); }
.playing .tally { animation:pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity:.35; } }
@media (prefers-reduced-motion: reduce) { .playing .tally { animation:none; } }
.art { width:44px; height:44px; border-radius:6px; object-fit:cover; background:var(--line); display:block; }
.main { text-align:left; min-width:0; display:block; width:100%; }
.body { min-width:0; }
.watch { display:inline-block; padding:6px 0 2px; font-size:13px; font-weight:600; color:var(--accent); text-decoration:none; }
.title { display:block; font-weight:600; font-size:15px; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.meta { display:block; font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
.bar { display:block; height:3px; margin-top:5px; background:var(--line); border-radius:2px; overflow:hidden; }
.bar i { display:block; height:100%; background:var(--accent); }
.icon { width:40px; height:44px; display:grid; place-items:center; color:var(--muted); }
.icon svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.grip { width:36px; height:44px; display:grid; place-items:center; color:var(--muted); touch-action:none; cursor:grab; }
.grip svg { width:18px; height:18px; fill:currentColor; }

.empty { padding:48px 8px; text-align:center; color:var(--muted); max-width:42ch; margin:0 auto; }
.empty strong { display:block; color:var(--ink); font:700 20px var(--display); margin-bottom:6px; }
.empty a, .hint a { color:var(--accent); }

.show-row { grid-template-columns:30px 44px minmax(0,1fr) 92px 36px; }
.mode { font-size:12px; line-height:1.2; font-weight:600; color:var(--accent); min-height:44px; padding:0 4px; text-align:right; }
.back { width:100%; padding:0 0 8px 82px; border-bottom:1px solid var(--line); }
.back li { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:14px; }
.back li span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.back li.done span { color:var(--muted); }
.skip { font-weight:600; }
.stepper { min-width:48px; min-height:40px; font-size:13px; font-weight:600; color:var(--accent); border:1px solid var(--line); border-radius:8px; font-variant-numeric:tabular-nums; }
.add { color:var(--accent); font-weight:600; font-size:13px; min-height:36px; padding:0 4px; }
.hint { font-size:13px; color:var(--muted); padding:14px 0 0; }

#player { background:var(--panel); border-top:1px solid var(--line); padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(16px,env(safe-area-inset-left,0px)); }
#nowTitle { font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#nowShow { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#seek { width:100%; margin:8px 0 2px; accent-color:var(--accent); display:block; }
.times { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
.controls { display:grid; grid-template-columns:1fr auto auto auto 1fr; align-items:center; justify-items:center; gap:14px; margin-top:4px; }
.jump { width:52px; height:48px; font:700 15px var(--display); color:var(--ink); }
#playBtn { width:58px; height:58px; border-radius:50%; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; }
#playBtn svg { width:26px; height:26px; fill:currentColor; }
#speedBtn { justify-self:start; font-weight:600; font-size:14px; min-width:48px; min-height:44px; font-variant-numeric:tabular-nums; }
#doneBtn { justify-self:end; font-weight:600; font-size:14px; color:var(--accent); min-height:44px; }
</style>
</head>
<body>
<div id="app">
  <header><h1>Running Order</h1><div class="head-right"><div id="status" role="status"></div><button id="refreshBtn" aria-label="Refresh episodes"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.3M20 5v6h-6"/></svg></button></div></header>
  <nav role="tablist">
    <button id="tabQueue" role="tab" aria-selected="true">Queue</button>
    <button id="tabShows" role="tab" aria-selected="false">Show rank</button>
  </nav>
  <main id="view"></main>
  <section id="player" hidden aria-label="Player">
    <div id="nowTitle"></div>
    <div id="nowShow"></div>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Position in episode">
    <div class="times"><span id="elapsed">0:00</span><span id="left">0:00</span></div>
    <div class="controls">
      <button id="speedBtn" aria-label="Playback speed">1x</button>
      <button id="backBtn" class="jump" aria-label="Back 15 seconds">-15</button>
      <button id="playBtn" aria-label="Play"></button>
      <button id="fwdBtn" class="jump" aria-label="Forward 30 seconds">+30</button>
      <button id="doneBtn">Skip</button>
    </div>
  </section>
  <audio id="audio" preload="metadata" playsinline></audio>
</div>
<script src="queue.js"></script>
<script src="app.js"></script>
</body>
</html>
