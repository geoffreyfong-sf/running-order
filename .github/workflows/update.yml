name: Check for new episodes
on:
  schedule:
    - cron: '17 * * * *'
    # Extra morning checks at 6:45, 7:15 and 7:45 Pacific. GitHub uses UTC,
    # so these cover both standard and daylight time.
    - cron: '45 13 * * *'
    - cron: '15 14 * * *'
    - cron: '45 14 * * *'
    - cron: '15 15 * * *'
    - cron: '45 15 * * *'
  push:
    paths:
      - shows.json
      - scripts/update.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock
      - run: node scripts/update.mjs
      - name: Save new episodes
        run: |
          git config user.name "Running Order"
          git config user.email "actions@users.noreply.github.com"
          git add feeds.json resolved.json
          git diff --cached --quiet || (git commit -m "Update episodes" && git push)
