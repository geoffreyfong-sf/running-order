name: Check for new episodes
on:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - shows.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock
      - run: node scripts/update.mjs
      - name: Save new episodes
        run: |
          git config user.name "Running Order"
          git config user.email "actions@users.noreply.github.com"
          git add feeds.json resolved.json
          git diff --cached --quiet || (git commit -m "Update episodes" && git push)
